# ffmpeg's WHIP muxer has no congestion control and dies on EAGAIN ("UDP send blocked") when the
# socket send buffer fills during WiFi hiccups; it asks for an 8 MB buffer (-ts_buffer_size), which
# the kernel caps at wmem_max. The original Pi ran with 4 MB.
net.core.wmem_max = 4194304
net.core.rmem_max = 4194304
